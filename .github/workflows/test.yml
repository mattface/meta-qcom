name: Tests

on:
  workflow_call:
    inputs:
      build_id:
        required: true
        type: string
      pr_number:
        required: false
        type: string
        description: "Pull request number. Added to the LAVA job metadata for PR builds"
      pr_url:
        required: false
        type: string
        description: "Pull request URL. Added to the LAVA job metadata for PR builds"
    outputs:
      summary_ids:
        description: "IDs of the test summary artifact"
        value: ${{ jobs.collect-ids.outputs.summary_ids }}
    secrets:
      LAVATOKEN:
        required: true
        description: "Token used to submit jobs to the LAVA lab"
env:
  # git sha, tag or branch in lava-test-plans repository
  LAVA_TEST_PLANS_REF: "6070e41a1472e3fd595ea7ac849f7c30f86a2282"
  # CalVer tag in qcom-linux-testkit repository (format: testkit-YYYY.MM.DD)
  TESTKIT_REF: "testkit-2026.08.14"

jobs:
  prepare-env:
    name: Prepare environment
    runs-on: ubuntu-latest
    steps:
      - name: "Print ref"
        shell: bash
        run: |
          echo "lava-test-plans ref: ${{ env.LAVA_TEST_PLANS_REF }}"
      - name: "Resolve the commit under test"
        id: source
        shell: bash
        env:
          EVENT_NAME: "${{ github.event_name }}"
          WORKFLOW_NAME: "${{ github.workflow }}"
          RUN_HEAD_SHA: "${{ github.event.workflow_run.head_sha }}"
          RUN_HEAD_BRANCH: "${{ github.event.workflow_run.head_branch }}"
          SHA: "${{ github.sha }}"
          REF_NAME: "${{ github.ref_name }}"
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            workflow_run)
              # PR builds reach this workflow through workflow_run, which runs
              # in the base context: github.sha is the target branch, not the
              # commit that was built. The build's own run carries that.
              SOURCE_SHA="${RUN_HEAD_SHA}"
              SOURCE_BRANCH="${RUN_HEAD_BRANCH}"
              BUILD_TYPE="PR"
              ;;
            push)
              SOURCE_SHA="${SHA}"
              SOURCE_BRANCH="${REF_NAME}"
              BUILD_TYPE="PUSH"
              ;;
            *)
              # Scheduled and manually dispatched runs, told apart by the name
              # of the workflow that called this one. Same vocabulary as the
              # buildType tag compile.yml puts on the build's S3 objects.
              SOURCE_SHA="${SHA}"
              SOURCE_BRANCH="${REF_NAME}"
              case "${WORKFLOW_NAME}" in
                *Weekly*) BUILD_TYPE="WEEKLY" ;;
                *Nightly*) BUILD_TYPE="NIGHTLY" ;;
                *) BUILD_TYPE="OTHER" ;;
              esac
              ;;
          esac
          {
            echo "source-sha=${SOURCE_SHA}"
            echo "source-branch=${SOURCE_BRANCH}"
            echo "build-type=${BUILD_TYPE}"
          } >> "$GITHUB_OUTPUT"
    outputs:
      lava-test-plans-ref: "${{ env.LAVA_TEST_PLANS_REF }}"
      testkit-ref: "${{ env.TESTKIT_REF }}"
      source-sha: "${{ steps.source.outputs.source-sha }}"
      source-branch: "${{ steps.source.outputs.source-branch }}"
      build-type: "${{ steps.source.outputs.build-type }}"
  test-nodistro:
    needs: [prepare-env]
    name: "Test nodistro"
    uses: ./.github/workflows/test-distro.yml
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_id: "${{ inputs.build_id }}"
      devices: "iq-8275-evk,iq-9075-evk,iq-x7181-evk,qcm6490-idp,qcs615-ride,rb3gen2-core-kit,qcs8300-ride-sx,qcs9100-ride-sx,dragonboard-410c,dragonboard-820c,rb1-core-kit"
      project_name: "meta-qcom"
      distro_name: "nodistro"
      lava_test_plans_ref: "${{ needs.prepare-env.outputs.lava-test-plans-ref }}"
      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
      pr_number: "${{ inputs.pr_number }}"
      pr_url: "${{ inputs.pr_url }}"
      source_sha: "${{ needs.prepare-env.outputs.source-sha }}"
      source_branch: "${{ needs.prepare-env.outputs.source-branch }}"
      build_type: "${{ needs.prepare-env.outputs.build-type }}"
  test-qcom-distro:
    needs: [prepare-env]
    name: "Test qcom-distro"
    uses: ./.github/workflows/test-distro.yml
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_id: "${{ inputs.build_id }}"
      devices: "glymur-crd,iq-8275-evk,iq-9075-evk,iq-x7181-evk,kaanapali-mtp,qcm6490-idp,qcs615-ride,rb3gen2-core-kit,qcs8300-ride-sx,qcs9100-ride-sx,rb1-core-kit,shikra-evk,sm8750-mtp"
      devices_premerge: "glymur-crd,iq-8275-evk,iq-9075-evk,iq-x7181-evk,kaanapali-mtp,qcm6490-idp,qcs615-ride,rb3gen2-core-kit,qcs8300-ride-sx,qcs9100-ride-sx,rb1-core-kit,shikra-evk,sm8750-mtp"
      project_name: "meta-qcom"
      distro_name: "qcom-distro"
      lava_test_plans_ref: "${{ needs.prepare-env.outputs.lava-test-plans-ref }}"
      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
      pr_number: "${{ inputs.pr_number }}"
      pr_url: "${{ inputs.pr_url }}"
      source_sha: "${{ needs.prepare-env.outputs.source-sha }}"
      source_branch: "${{ needs.prepare-env.outputs.source-branch }}"
      build_type: "${{ needs.prepare-env.outputs.build-type }}"
  test-qcom-distro_linux-qcom-6-18:
    needs: [prepare-env]
    name: "Test qcom-distro_linux-qcom-6.18"
    uses: ./.github/workflows/test-distro.yml
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_id: "${{ inputs.build_id }}"
      devices: "iq-8275-evk,iq-9075-evk,iq-x7181-evk,qcm6490-idp,qcs615-ride,rb3gen2-core-kit,qcs8300-ride-sx,qcs9100-ride-sx,rb1-core-kit"
      devices_premerge: "iq-8275-evk,iq-9075-evk,iq-x7181-evk,qcm6490-idp,qcs615-ride,rb3gen2-core-kit,qcs8300-ride-sx,qcs9100-ride-sx,rb1-core-kit"
      project_name: "meta-qcom"
      distro_name: "qcom-distro"
      distro_suffix: "_linux-qcom-6.18"
      lava_test_plans_ref: "${{ needs.prepare-env.outputs.lava-test-plans-ref }}"
      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
      pr_number: "${{ inputs.pr_number }}"
      pr_url: "${{ inputs.pr_url }}"
      source_sha: "${{ needs.prepare-env.outputs.source-sha }}"
      source_branch: "${{ needs.prepare-env.outputs.source-branch }}"
      build_type: "${{ needs.prepare-env.outputs.build-type }}"

  collect-ids:
    name: "Collect Summary artifact IDs"
    needs: [test-nodistro, test-qcom-distro, test-qcom-distro_linux-qcom-6-18]
    if: |
      always()
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    outputs:
      summary_ids: ${{ steps.generate-summary.outputs.artifact_ids }}
    steps:
      - name: Summary IDs
        id: generate-summary
        env:
          NODISTRO_SUMMARY_ID: ${{ needs.test-nodistro.outputs.summary_id }}
          QCOM_DISTRO_SUMMARY_ID: ${{ needs.test-qcom-distro.outputs.summary_id }}
          QCOM_DISTRO_6_18_SUMMARY_ID: ${{ needs.test-qcom-distro_linux-qcom-6-18.outputs.summary_id }}
        run: |
          echo "artifact_ids=${NODISTRO_SUMMARY_ID},${QCOM_DISTRO_SUMMARY_ID},${QCOM_DISTRO_6_18_SUMMARY_ID}" >> $GITHUB_OUTPUT
